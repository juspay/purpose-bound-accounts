{% extends "base.html" %}

{% block title %}Deposit - PBA Admin{% endblock %}

{% block content %}
<h1>Deposit</h1>
<p><a href="/admin/accounts/{{ account_id }}">&larr; Back to account</a></p>

<article>
    <p><strong>Account:</strong> {{ account_id }}</p>
    <p><strong>Purpose:</strong> {{ purpose_code }}</p>

    {% if let Some(err) = error %}
    <p id="form-error" style="color: #c62828;"><strong>Error:</strong> {{ err }}</p>
    {% endif %}

    <form method="post" action="/admin/accounts/{{ account_id }}/deposit">
        <label>
            Amount (paisa)
            <input type="number" name="amount" min="1" required>
        </label>
        <div class="grid">
            <label>
                Source IFSC
                <input type="text" name="source_ifsc" required>
            </label>
            <label>
                Source Account Number
                <input type="text" name="source_account_number" required>
            </label>
        </div>
        <button type="submit">Deposit</button>
    </form>
</article>
{% endblock %}
