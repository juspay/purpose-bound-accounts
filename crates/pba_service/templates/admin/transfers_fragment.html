{% if transfers.is_empty() %}
<article>
    <div style="text-align: center; padding: 2rem 1rem; color: var(--text-muted);">
        <div style="font-size: 2rem; opacity: 0.25; margin-bottom: 0.5rem;">📭</div>
        <p class="mb-0"><strong>No transactions yet.</strong></p>
        <p class="text-small mt-1 mb-0">Deposits, payments and withdrawals will appear here.</p>
    </div>
</article>
{% else %}
<figure>
<table>
    <thead>
        <tr>
            <th>Timestamp</th>
            <th>Type</th>
            <th>Pool</th>
            <th>Direction</th>
            <th style="text-align: right;">Amount (INR)</th>
        </tr>
    </thead>
    <tbody>
        {% for t in &transfers %}
        <tr>
            <td class="text-small muted">{{ t.timestamp }}</td>
            <td>{{ t.transfer_type }}</td>
            <td>{{ t.pool }}</td>
            <td class="{{ t.direction_class }}">{{ t.direction }}</td>
            <td class="mono" style="text-align: right;">₹{{ t.amount }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</figure>

<div class="flex-gap" style="justify-content: space-between; margin-top: 0.75rem;">
    <small class="muted">Showing {{ offset + 1 }}–{{ offset + count }} of {{ total }} transactions</small>
    <div class="flex-gap">
        {% if offset > 0 %}
        <a hx-get="{{ prefix }}/admin/accounts/{{ account_id }}/transfers?offset={{ prev_offset }}&limit={{ limit }}" hx-target="#transfers" hx-swap="innerHTML" role="button" class="outline btn-sm">← Previous</a>
        {% endif %}
        {% if has_next %}
        <a hx-get="{{ prefix }}/admin/accounts/{{ account_id }}/transfers?offset={{ next_offset }}&limit={{ limit }}" hx-target="#transfers" hx-swap="innerHTML" role="button" class="outline btn-sm">Next →</a>
        {% endif %}
    </div>
</div>
{% endif %}
