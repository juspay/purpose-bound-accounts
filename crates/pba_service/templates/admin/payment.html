{% extends "base.html" %}

{% block title %}Payment - PBA Admin{% endblock %}

{% block content %}
<h1>Make Payment</h1>
<p><a href="{{ prefix }}/admin/accounts/{{ account_id }}">&larr; Back to account</a></p>

<article>
    <p><strong>Account:</strong> {{ account_id }}</p>
    <p><strong>Purpose:</strong> {{ purpose_code }}</p>

    {% if let Some(err) = error %}
    <p id="form-error" style="color: #c62828;"><strong>Error:</strong> {{ err }}</p>
    {% endif %}

    <form method="post" action="{{ prefix }}/admin/accounts/{{ account_id }}/payment">
        <label>
            Amount (paisa)
            <input type="number" name="amount" min="1" required>
        </label>
        <div class="grid">
            <label>
                Merchant ID
                <input type="text" name="merchant_id" required>
            </label>
            <label>
                Merchant MCC
                <input type="text" name="merchant_mcc" required>
            </label>
        </div>
        <label>
            Description
            <input type="text" name="description" required>
        </label>
        <label>
            Gateway Reference (optional)
            <input type="text" name="gateway_ref" placeholder="e.g. gw-txn-12345">
        </label>
        <button type="submit">Make Payment</button>
    </form>
</article>
{% endblock %}
