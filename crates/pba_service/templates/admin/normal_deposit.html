{% extends "base.html" %}

{% block title %}Deposit - Normal Account - PBA Admin{% endblock %}

{% block content %}
<h1>Deposit to Normal Account</h1>
<p><a href="{{ prefix }}/admin/normal-accounts/{{ account_id }}">&larr; Back to account</a></p>

<article>
    <p><strong>Account:</strong> {{ account_id }}</p>
    <p><strong>Holder:</strong> {{ holder_id }}</p>

    {% if let Some(err) = error %}
    <p id="form-error" style="color: #c62828;"><strong>Error:</strong> {{ err }}</p>
    {% endif %}

    <form method="post" action="{{ prefix }}/admin/normal-accounts/{{ account_id }}/deposits">
        <label>
            Amount (paisa)
            <input type="number" name="amount" min="1" required>
        </label>
        <label>
            <input type="checkbox" name="pending" value="true">
            Pending (two-phase deposit — must be posted or voided later)
        </label>
        <label>
            Gateway Reference (optional)
            <input type="text" name="gateway_ref" placeholder="e.g. gw-txn-12345">
        </label>
        <label>
            Timeout Seconds (optional, only used for pending deposits)
            <input type="number" name="timeout_seconds" min="1" placeholder="e.g. 3600">
        </label>
        <button type="submit">Deposit</button>
    </form>
</article>
{% endblock %}
