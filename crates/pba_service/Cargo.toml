[package]
name = "pba-service"
version = "0.1.0"
edition = "2021"
description = "Purpose-Bound Account Service — dual-pool accounts with purpose-based MCC validation"

[dependencies]
askama = "0.13"
async-trait = "0.1"
aws-config = "1"
aws-sdk-kms = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
cookie = { version = "0.18", features = ["signed", "key-expansion"] }
dashmap = "6"
jsonwebtoken = "9"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono"] }
tigerbeetle-unofficial = "0.14"
tokio = { version = "1", features = ["full"] }
tower-cookies = { version = "0.11", features = ["signed"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
cucumber = "0.22"
pba_client = { path = "../pba_client" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
chromiumoxide = { version = "0.9" }
futures = "0.3"
regex = "1"

[[test]]
name = "e2e"
harness = false

[[test]]
name = "ui_e2e"
harness = false
