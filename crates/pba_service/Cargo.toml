[package]
name = "pba-service"
version = "0.1.0"
edition = "2021"
description = "Purpose-Bound Account Service — dual-pool accounts with purpose-based MCC validation"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tigerbeetle-unofficial = "0.14"
askama = "0.13"
async-trait = "0.1"
base64 = { version = "0.22", optional = true }
aws-sdk-kms = { version = "1", optional = true }
aws-config = { version = "1", optional = true }

[features]
default = []
aws-kms = ["dep:aws-sdk-kms", "dep:aws-config", "dep:base64"]

[dev-dependencies]
cucumber = "0.22"
pba_client = { path = "../pba_client" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
chromiumoxide = { version = "0.9" }
futures = "0.3"
regex = "1"

[[test]]
name = "e2e"
harness = false

[[test]]
name = "ui_e2e"
harness = false
