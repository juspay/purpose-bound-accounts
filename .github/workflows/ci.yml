name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: pba_service=debug
  CI_DB_URL: postgresql://postgres:postgres@localhost:5432/pba_service_test
  CI_TB_PORT: "3001"
  CI_APP_PORT: "3031"

jobs:
  check:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - run: just fmt-check
      - run: just lint
      - run: just build

  api-e2e:
    name: API E2E Tests
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pba_service_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
        with:
          with-tigerbeetle: "true"
      - run: just build
      - run: just tb-start $CI_TB_PORT .tb_data/test
      - run: just service-start $CI_APP_PORT $CI_DB_URL $CI_TB_PORT
      - run: just api-e2e-run
      - if: always()
        run: just service-stop $CI_APP_PORT

  ui-e2e:
    name: UI E2E Tests
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pba_service_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
        with:
          with-tigerbeetle: "true"
          with-chromium: "true"
      - run: just build
      - run: just tb-start $CI_TB_PORT .tb_data/test
      - run: just service-start $CI_APP_PORT $CI_DB_URL $CI_TB_PORT
      - run: just ui-e2e-run
      - if: always()
        run: just service-stop $CI_APP_PORT
