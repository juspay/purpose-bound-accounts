name: Setup Toolchain
description: Install Rust, Zig, just, and configure cargo cache

inputs:
  rust-components:
    description: Additional Rust components (comma-separated)
    required: false
    default: ""
  with-tigerbeetle:
    description: Install TigerBeetle
    required: false
    default: "false"
  with-chromium:
    description: Install Chromium for UI tests
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.rust-components }}

    - name: Install just
      uses: extractions/setup-just@v2

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-

    - name: Install Zig 0.14
      uses: mlugg/setup-zig@v2
      with:
        version: 0.14.1

    - name: Set ZIG_PATH
      shell: bash
      run: echo "ZIG_PATH=$(which zig)" >> $GITHUB_ENV

    - name: Install TigerBeetle
      if: inputs.with-tigerbeetle == 'true'
      shell: bash
      run: |
        curl -sL https://global.tigerbeetle.com/install.sh | bash
        echo "$HOME/.tigerbeetle" >> $GITHUB_PATH

    - name: Install Chromium
      if: inputs.with-chromium == 'true'
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable
