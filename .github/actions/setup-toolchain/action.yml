name: Setup Toolchain
description: Install Rust, Zig, just, and configure cargo cache

inputs:
  with-tigerbeetle:
    description: Install TigerBeetle
    required: false
    default: "false"
  with-chromium:
    description: Install Chromium for UI tests
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Rust (from rust-toolchain.toml)
      uses: dtolnay/rust-toolchain@stable

    - name: Install just
      uses: extractions/setup-just@v2

    - name: Cache Rust builds
      uses: Swatinem/rust-cache@v2

    - name: Install Zig 0.14
      uses: mlugg/setup-zig@v2
      with:
        version: 0.14.1

    - name: Set ZIG_PATH
      shell: bash
      run: echo "ZIG_PATH=$(which zig)" >> $GITHUB_ENV

    - name: Install TigerBeetle
      if: inputs.with-tigerbeetle == 'true'
      shell: bash
      run: |
        TB_VERSION=0.16.78
        curl -sLO "https://github.com/tigerbeetle/tigerbeetle/releases/download/${TB_VERSION}/tigerbeetle-x86_64-linux.zip"
        unzip -q tigerbeetle-x86_64-linux.zip -d "$HOME/.tigerbeetle"
        rm tigerbeetle-x86_64-linux.zip
        echo "$HOME/.tigerbeetle" >> $GITHUB_PATH

    - name: Install Chromium
      if: inputs.with-chromium == 'true'
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable
