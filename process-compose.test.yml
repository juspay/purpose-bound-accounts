version: "0.5"

processes:
  postgres:
    command: |
      if [ -n "${CI:-}" ]; then
        echo "Postgres provided by CI, idling..."
        tail -f /dev/null
      fi
      if [ ! -d "${PG_DATA:-.pg_data}" ]; then
        initdb -D "${PG_DATA:-.pg_data}" --auth=trust
      fi
      exec postgres -D "${PG_DATA:-.pg_data}" -p 5432 -k /tmp
    readiness_probe:
      exec:
        command: bash -c 'if [ -n "${CI:-}" ]; then nc -z ${DB_HOST:-localhost} 5432; else pg_isready -h /tmp -p 5432 -d postgres; fi'
      initial_delay_seconds: 1
      period_seconds: 1
    shutdown:
      signal: 2

  db-reset:
    command: |
      PG_ARGS="-h ${DB_HOST:-/tmp} -p 5432"
      [ -n "${DB_USER:-}" ] && PG_ARGS="$PG_ARGS -U $DB_USER"
      export PGPASSWORD="${DB_PASSWORD:-}"
      psql $PG_ARGS -d postgres -c "DROP DATABASE IF EXISTS pba_service_test;" > /dev/null
      psql $PG_ARGS -d postgres -c "CREATE DATABASE pba_service_test;" > /dev/null
      echo "Test database reset"
    depends_on:
      postgres:
        condition: process_healthy
    availability:
      restart: "no"

  keycloak:
    command: |
      if [ -n "${CI:-}" ]; then
        echo "Keycloak not needed in CI (AUTH_ENABLED=false), idling..."
        sleep infinity
      fi
      docker run --rm --name pba-keycloak-test \
        -p 8181:8080 \
        -v "$(pwd)/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro" \
        -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
        -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
        quay.io/keycloak/keycloak:26.2 \
        start-dev --import-realm
    readiness_probe:
      exec:
        command: bash -c 'if [ -n "${CI:-}" ]; then true; else curl -sf http://127.0.0.1:8181/realms/pba/.well-known/openid-configuration > /dev/null; fi'
      initial_delay_seconds: 1
      period_seconds: 3
      failure_threshold: 20
    shutdown:
      command: bash -c 'if [ -n "${CI:-}" ]; then true; else docker rm -f pba-keycloak-test; fi'
      signal: 15

  tigerbeetle:
    command: |
      if [ ! -f .tb_data/test/0_0.tigerbeetle ]; then
        mkdir -p .tb_data/test
        tigerbeetle format --cluster=0 --replica=0 --replica-count=1 .tb_data/test/0_0.tigerbeetle
      fi
      exec tigerbeetle start --addresses=3001 .tb_data/test/0_0.tigerbeetle
    readiness_probe:
      exec:
        command: nc -z 127.0.0.1 3001
      initial_delay_seconds: 5
      period_seconds: 2
      failure_threshold: 10

  pba-service:
    command: |
      if [ -n "${CI:-}" ]; then
        AUTH_ENABLED=false DB_NAME=pba_service_test TIGERBEETLE_ADDRESSES=3001 PORT=3031 target/debug/pba-service
      else
        AUTH_ENABLED=false DB_NAME=pba_service_test TIGERBEETLE_ADDRESSES=3001 PORT=3031 cargo run -p pba-service
      fi
    depends_on:
      db-reset:
        condition: process_completed_successfully
      tigerbeetle:
        condition: process_healthy
      keycloak:
        condition: process_healthy
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 3031
        path: /health
      initial_delay_seconds: 10
      period_seconds: 5
      failure_threshold: 60
