[workspace]
members = [".", "crates/pba_client"]

[package]
name = "pba-service"
version = "0.1.0"
edition = "2021"
description = "Purpose-Bound Account Service — dual-pool accounts with purpose-based MCC validation"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tigerbeetle-unofficial = { version = "0.14", optional = true }

[features]
default = ["tigerbeetle"]
tigerbeetle = ["dep:tigerbeetle-unofficial"]
inmem = []

[dev-dependencies]
cucumber = "0.22"
pba_client = { path = "crates/pba_client" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "e2e"
harness = false
